<div #map class="h-[60vh] sm:h-[calc(100vh-64px)] "></div>



<section class="h-[40vh] sm:fixed sm:w-[270px] bg-white sm:rounded sm:top-20 sm:left-10 p-5 overflow-y-scroll">
    <h2 class="text-xl font-bold text-black mb-2">Marcadores</h2>


    <div class="flex flex-col gap-2">

        @for(marker of markers(); track marker.id){

            <div class="form-control w-full max-w-full min-w-0" (click)="flyToMarker(marker.mapboxMarker.getLngLat())"
            (dblclick)="deleteMarker(marker)">
                <label class="label w-full min-w-0 items-start gap-2 cursor-pointer">
                    <span class="label-text min-w-0 flex-1 whitespace-normal break-words text-black text-xs">{{marker.mapboxMarker.getLngLat() | json}}</span>
                    <input
                    type="radio" name="radio-10" checked="checked"
                    class="radio shrink-0" 
                    [style]="{backgroundColor: marker.mapboxMarker._color}"/>
                </label>
            </div>

        }@empty {
            <div class="flex justify-center items-center bg-blue-100 rounded py-5">
                <p class="text-xs text-secondary">No markers available</p>
            </div>
        }
    
    </div>
</section>
